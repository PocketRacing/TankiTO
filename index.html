<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TankiTO — Гараж</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101318;color:#eee;
  font-family:Arial,sans-serif;overflow:hidden
}
header{
  height:58px;background:#191e25;border-bottom:1px solid #343b45;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px
}
.logo{font-size:22px;font-weight:bold;color:#f0a52b}
.status{font-size:12px;color:#aab3bd}
main{display:flex;height:calc(100vh - 58px)}
aside{
  width:245px;flex-shrink:0;background:#191e25;
  padding:18px;overflow-y:auto;border-right:1px solid #343b45
}
h3{font-size:14px;color:#aab3bd;margin:10px 0}
button{
  background:#292f38;color:#eee;border:1px solid #414a56;
  border-radius:6px;padding:11px;cursor:pointer
}
button:hover{background:#394351}
button.active{background:#a96516;border-color:#f0a52b}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wide{width:100%;margin-top:8px}
hr{border:0;border-top:1px solid #343b45;margin:20px 0}
#viewer{position:relative;flex:1;min-width:0}
#scene{width:100%;height:100%;display:block;touch-action:none}
.info{
  position:absolute;left:16px;top:14px;background:#191e25dd;
  padding:12px 14px;border-radius:8px;font-size:13px;
  line-height:1.6;pointer-events:none
}
.help{
  position:absolute;bottom:14px;left:14px;right:14px;
  text-align:center;color:#aab3bd;font-size:12px;
  pointer-events:none
}
label{display:block;color:#aab3bd;font-size:12px;margin-top:12px}
input{
  width:100%;padding:10px;margin-top:5px;background:#101318;
  color:#fff;border:1px solid #414a56;border-radius:5px
}
@media(max-width:650px){
  aside{width:150px;padding:10px}
  .buttons{grid-template-columns:1fr}
  header{padding:0 10px}
  .info{font-size:11px;left:8px;top:8px}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<header>
  <div class="logo">TankiTO</div>
  <div class="status" id="status">Загрузка танка...</div>
</header>

<main>
  <aside>
    <h3>КОРПУС</h3>
    <div class="buttons">
      <button class="active" id="hunter">Hunter</button>
      <button id="thunder">Thunder</button>
    </div>

    <hr>
    <h3>МОДИФИКАЦИЯ</h3>
    <div class="buttons">
      <button class="active" data-m="M0">M0</button>
      <button data-m="M1">M1</button>
      <button data-m="M2">M2</button>
      <button data-m="M3">M3</button>
    </div>

    <hr>
    <h3>ПОЗИЦИЯ ПУШКИ</h3>
    <label>Высота</label>
    <input id="height" type="range" min="-2" max="4" step="0.05" value="0">

    <label>Смещение вперёд / назад</label>
    <input id="forward" type="range" min="-3" max="3" step="0.05" value="0">

    <label>Масштаб пушки</label>
    <input id="scale" type="range" min="0.25" max="2" step="0.05" value="1">

    <button class="wide" id="reset">Сбросить позицию</button>
    <button class="wide" id="reload">Загрузить модели заново</button>

    <hr>
    <h3>УПРАВЛЕНИЕ</h3>
    <div style="font-size:12px;line-height:1.7;color:#aab3bd">
      Мышь или палец — вращение камеры.<br>
      Колесо мыши — приближение.<br>
      Ползунки — настройка установки пушки.
    </div>
  </aside>

  <section id="viewer">
    <canvas id="scene"></canvas>
    <div class="info">
      <b>ГАРАЖ</b><br>
      Корпус: Hunter<br>
      Башня: Thunder<br>
      <span id="modelStatus">Подготовка моделей...</span>
    </div>
    <div class="help">Вращай танк мышью или пальцем, чтобы проверить установку пушки</div>
  </section>
</main>

<script type="module">
import * as THREE from 'three';
import { TDSLoader } from 'three/addons/loaders/TDSLoader.js';

const canvas = document.querySelector('#scene');
const viewer = document.querySelector('#viewer');
const status = document.querySelector('#status');
const modelStatus = document.querySelector('#modelStatus');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x252b33);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
camera.position.set(8, 6, 10);

const renderer = new THREE.WebGLRenderer({
  canvas, antialias:true, alpha:false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xddeaff, 0x34302a, 2.2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(8, 12, 7);
sun.castShadow = true;
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({color:0x30363c, roughness:0.9})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(100, 100, 0x626b75, 0x414952);
grid.position.y = 0;
scene.add(grid);

const loader = new TDSLoader();
const tank = new THREE.Group();
scene.add(tank);

let hull = null;
let turret = null;
let loadId = 0;
let cameraDistance = 14;
let dragging = false;
let lastX = 0;
let lastY = 0;
let rotationY = -0.55;
let rotationX = 0.12;

const defaults = {height:0, forward:0, scale:1};

function prepareModel(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      if (child.material) {
        const materials = Array.isArray(child.material)
          ? child.material : [child.material];

        materials.forEach(mat => {
          if (mat.color && mat.color.getHex() === 0xffffff) {
            mat.color.set(0xc1c5c8);
          }
          mat.side = THREE.DoubleSide;
          mat.needsUpdate = true;
        });
      }
    }
  });
}

function bounds(object) {
  object.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(object);
}

function centerOnXZ(object) {
  const box = bounds(object);
  const center = box.getCenter(new THREE.Vector3());
  object.position.x -= center.x;
  object.position.z -= center.z;
}

function fitTank() {
  const box = bounds(tank);
  if (box.isEmpty()) return;

  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  tank.position.x = -center.x;
  tank.position.z = -center.z;
  tank.position.y = -box.min.y;

  const maxDim = Math.max(size.x, size.y, size.z, 1);
  cameraDistance = maxDim * 2.3;
  camera.near = Math.max(0.01, maxDim / 1000);
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();
}

function positionTurret() {
  if (!hull || !turret) return;

  // Сначала центрируем корпус по горизонтали.
  centerOnXZ(hull);

  // Определяем реальную верхнюю поверхность корпуса.
  const hullBox = bounds(hull);
  const hullTop = hullBox.max.y;

  // Центрируем башню и помещаем её основание над корпусом.
  centerOnXZ(turret);
  let turretBox = bounds(turret);
  const turretBottom = turretBox.min.y;

  const heightOffset = Number(document.querySelector('#height').value);
  const forwardOffset = Number(document.querySelector('#forward').value);
  const turretScale = Number(document.querySelector('#scale').value);

  // Масштабирование относительно центра модели.
  turret.scale.setScalar(turretScale);
  turretBox = bounds(turret);

  // Перемещаем башню на верх корпуса.
  turret.position.y += hullTop - turretBox.min.y + heightOffset;

  // Смещение по продольной оси танка.
  turret.position.z += forwardOffset;

  fitTank();
}

function clearModels() {
  for (const obj of [hull, turret]) {
    if (!obj) continue;
    tank.remove(obj);
    obj.traverse(child => {
      if (child.isMesh) {
        child.geometry?.dispose();
        const materials = Array.isArray(child.material)
          ? child.material : [child.material];
        materials.forEach(m => m?.dispose());
      }
    });
  }
  hull = null;
  turret = null;
}

async function loadModels() {
  const thisLoad = ++loadId;
  status.textContent = 'Загрузка моделей...';
  modelStatus.textContent = 'Загружаем корпус и пушку';
  clearModels();

  try {
    const [newHull, newTurret] = await Promise.all([
      loader.loadAsync('Hunter/old/m0/hull.3ds'),
      loader.loadAsync('Thunder/old/m0/turret.3ds')
    ]);

    if (thisLoad !== loadId) return;

    hull = newHull;
    turret = newTurret;

    prepareModel(hull);
    prepareModel(turret);

    tank.add(hull);
    tank.add(turret);

    positionTurret();

    status.textContent = 'Танк загружен';
    modelStatus.textContent = 'Корпус и пушка установлены';
  } catch (error) {
    console.error(error);
    status.textContent = 'Ошибка загрузки';
    modelStatus.textContent =
      'Проверь пути к файлам .3ds и запуск через GitHub Pages';
  }
}

function resize() {
  const width = viewer.clientWidth;
  const height = viewer.clientHeight;
  if (!width || !height) return;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}
new ResizeObserver(resize).observe(viewer);
resize();

function updateCamera() {
  const cosX = Math.cos(rotationX);
  camera.position.set(
    Math.sin(rotationY) * cosX * cameraDistance,
    Math.sin(rotationX) * cameraDistance + cameraDistance * 0.12,
    Math.cos(rotationY) * cosX * cameraDistance
  );
  camera.lookAt(0, cameraDistance * 0.15, 0);
}
updateCamera();

canvas.addEventListener('pointerdown', e => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  rotationY += (e.clientX - lastX) * 0.008;
  rotationX += (lastY - e.clientY) * 0.006;
  rotationX = Math.max(-0.5, Math.min(0.9, rotationX));
  lastX = e.clientX;
  lastY = e.clientY;
  updateCamera();
});
canvas.addEventListener('pointerup', () => dragging = false);
canvas.addEventListener('pointercancel', () => dragging = false);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  cameraDistance *= e.deltaY > 0 ? 1.1 : 0.9;
  cameraDistance = Math.max(2, Math.min(150, cameraDistance));
  updateCamera();
}, {passive:false});

document.querySelector('#height').addEventListener('input', positionTurret);
document.querySelector('#forward').addEventListener('input', positionTurret);
document.querySelector('#scale').addEventListener('input', positionTurret);

document.querySelector('#reset').addEventListener('click', () => {
  document.querySelector('#height').value = defaults.height;
  document.querySelector('#forward').value = defaults.forward;
  document.querySelector('#scale').value = defaults.scale;
  positionTurret();
});

document.querySelector('#reload').addEventListener('click', loadModels);

document.querySelector('#hunter').addEventListener('click', () => {
  document.querySelector('#hunter').classList.add('active');
  document.querySelector('#thunder').classList.remove('active');
  status.textContent = 'Корпус Hunter';
});

document.querySelector('#thunder').addEventListener('click', () => {
  document.querySelector('#thunder').classList.add('active');
  document.querySelector('#hunter').classList.remove('active');
  status.textContent = 'Пушка Thunder';
});

document.querySelectorAll('[data-m]').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('[data-m]').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    status.textContent = 'Выбрана модификация ' + button.dataset.m;
  });
});

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

loadModels();
</script>
</body>
</html>
